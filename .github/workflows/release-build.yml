name: macOS Release Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Release (arm64)
    runs-on: macos-15
    timeout-minutes: 20
    env:
      ARTIFACT_NAME: codex-token-bar-macos-arm64
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run tests
        run: bash scripts/test.sh

      - name: Build release app
        run: bash scripts/build-app.sh

      - name: Verify release binary
        run: |
          binary="dist/Codex Token Bar.app/Contents/MacOS/CodexTokenBar"
          lipo "$binary" -verify_arch arm64
          "$binary" --help

      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/Codex Token Bar.app" "dist/${ARTIFACT_NAME}.zip"

      - name: Upload release app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/${{ env.ARTIFACT_NAME }}.zip
          archive: false
          if-no-files-found: error
          retention-days: 14
